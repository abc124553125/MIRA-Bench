# ============================================================
#  Mirror-VLM Benchmark unified config
# ============================================================

experiment_name: "gemini-2.5-pro_rgbdm"   # Change this for each experiment to avoid overwrites.
prompt_version: "v4"
seed: 42

paths:
  qa_json: "Dataset/annotations/questions.json"
  data_root: "."
  output_dir: "Outputs/gemini-2.5-pro_rgbdm"

  # ===== Switch 1: rgb_dir =====
  # rgb_dir: "Dataset/images/rgb"                                  # unmarked
  rgb_dir: "Dataset/images/mirror_marked_rgb"     # marked

  # ===== Switch 2: depth_dir; active when use_depth=true =====
  # depth_dir: "Dataset/images/depth_colorized"                            # unmarked
  depth_dir: "Dataset/images/mirror_marked_depth" # marked

input:
  use_depth: true          # ===== Switch 3: whether to send depth =====
  use_mirror_marked: true  # ===== Switch 4: whether visual_bbox uses mirror-marked or original images =====

  image_suffixes: [".jpg", ".jpeg", ".png"]
  max_samples: null          # Use a small value for tests; use null for a full run.
  allowed_question_types: null 
  # allowed_question_types:
  #   - yes_no
  #   - single_choice
  #   - multi_choice
  #   - spatial_3d_axes
  #   - count
  #   - single_choice_plus_text

  allowed_referring_styles: null
  # allowed_referring_styles:
  #   - bbox_text
  #   - bbox_text_desc
  #   - visual_bbox
  #   - visual_bbox_desc
  #   - visual_mask

  allowed_template_ids: null 
  # allowed_template_ids:
    # - vc_001
    # - vc_002
    # - vc_003
    # - mc_001
    # - mc_002
    # - mc_003
    # - mr_001
    # - mr_003
    # - ct_001
    # - ac_001
    # - ac_002
    # - ac_003
    # - ac_004
    # - mpac_001

  include_categories: null 
  # include_categories:
  #   - perception
  #   - reasoning
  #   - action

  exclude_categories: null

prompt:
  system_prompt: |
    You are evaluating a visual reasoning benchmark about mirror scenes.
    Answer strictly using the required JSON schema.
    Do not output markdown.
    Do not output any extra text outside the JSON object.

  task_instruction: |
    Use the provided image(s) to answer the question.
    The final answer must be based on what you can observe in the image(s).

  task_background: |
    Task background:
    - Some objects are seen directly in the real world.
    - Some objects are seen only through a mirror reflection.
    - A mirror instance and a real-world instance may refer to the same physical object.
    - All spatial descriptions use the ego-centered coordinate system of the input image.
    - "Left" and "right" refer to the image/observer's left and right.
    - "Front" and "behind" refer to depth relative to the observer in the current image view.
    - Unless explicitly stated otherwise, answer from the viewpoint of the current image.
    - Use only the provided visual evidence.

  # ===== Switch 5: mirror_hint =====
  # Use an empty string for unmarked experiments; uncomment the matching block for marked experiments.
  # mirror_hint: ""
  # mirror_hint: |                          # RGB marked
  #   The semi-transparent green overlay on the image indicates reflective surface regions,
  #   which may include mirrors, glass, lake surfaces, or convex mirrors.
  mirror_hint: |                          # RGB+D both marked
    The semi-transparent green overlay on the RGB image indicates reflective surface regions,
    which may include mirrors, glass, lake surfaces, or convex mirrors.
    The semi-transparent white overlay on the depth map marks the same reflective regions.

    # Use an empty string for unmarked experiments; uncomment the matching block for marked experiments.

  # ===== depth_hint =====
  depth_hint: |
    You are provided with two images: the first is an RGB image,
    and the second is a depth map using jet colormap
    (blue = near/close to camera, red = far from camera).
    Use the depth map to reason about relative distances and spatial positions of objects.
   

  ask_for_brief_explanation: true
  explanation_max_words: 20

